<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><base target="_top">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2733;--mut:#6b7684;--ln:#e3dfd6;--pri:#1f4e79;--in:#1b7f4b;--out:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d242c;--tx:#eef1f4;--mut:#9aa6b2;--ln:#2e3842;--pri:#6aa6dd;--in:#4cc384;--out:#ee8a78}.logo{filter:invert(1)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px "Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:14px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.logo{height:56px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{flex:1;min-width:90px;padding:9px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.grid .card{margin:0}.grid small{color:var(--mut);display:block}.grid b{font-size:18px}
.in{color:var(--in)}.out{color:var(--out)}
input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
.btn{padding:10px;border:0;border-radius:10px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.seg{display:flex;gap:6px}.seg .btn{flex:1}.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}th{color:var(--mut)}
.chart{display:flex;gap:10px;height:110px;align-items:flex-end}.col{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars{display:flex;gap:3px;height:90px;align-items:flex-end;justify-content:center}.bars i{width:40%;min-height:2px;border-radius:4px 4px 0 0}
.x{background:none;border:0;color:var(--out);cursor:pointer;font-size:16px}.err{color:var(--out);font-size:13px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><main>

<div class="tabs" id="tabs"></div>
<div class="card" id="lock"><h2 id="lt"></h2><label>كلمة سر الصندوق</label><input id="pw" type="password"><p class="err" id="le"></p><button class="btn" id="go" style="width:100%">دخول</button></div>
<div id="app" hidden>
<div class="grid" id="cards"></div>
<div class="card"><h2>آخر ٦ شهور</h2><div class="chart" id="chart"></div></div>
<div class="card"><h2>تسجيل حركة</h2><form id="f">
<div class="full seg"><button type="button" class="btn" id="tIn">وارد (عشور)</button><button type="button" class="btn alt" id="tOut">مصروف</button></div>
<div><label>التاريخ</label><input type="date" id="date" required></div>
<div><label>المبلغ (جنيه)</label><input type="number" id="amt" min="0" step="0.01" inputmode="decimal" required></div>
<div class="xo"><label>البند</label><select id="cat"></select></div>
<div class="xo"><label>اسم المستفيد</label><input id="who"></div>
<div class="xo"><label>رقم الموبايل</label><input id="ph" type="tel" inputmode="tel"></div>
<div class="xo"><label>رقم الإيصال</label><input id="rc"></div>
<div class="full"><label>ملاحظات</label><input id="nt"></div>
<p class="err full" id="fe"></p><button class="btn full" id="sv">حفظ</button></form></div>
<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><h2>السجل</h2><span><button class="btn alt" id="exp" style="padding:6px 12px">تنزيل CSV</button> <button class="btn alt" id="lk" style="padding:6px 12px">قفل</button></span></div>
<div style="display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:6px"><input id="q" type="search" placeholder="بحث بالاسم أو الموبايل أو الإيصال أو الملاحظات"><select id="ft"><option value="">الكل</option><option value="in">وارد</option><option value="out">مصروف</option></select></div>
<div id="sum" style="color:var(--mut);font-size:13px;margin-bottom:6px"></div>
<div class="wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>البند</th><th>الاسم</th><th>الموبايل</th><th>المبلغ</th><th>إيصال</th><th>ملاحظات</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></main>
<script>
const FUNDS={schools:{n:"المدارس والجامعات والمعاهد",c:["مدارس","جامعات","معاهد","أخرى"]},brides:{n:"العرائس",c:["جهاز عروسة","مساعدة","أخرى"]},projects:{n:"المشاريع",c:["تكلفة مشروع","أخرى"]},sick:{n:"المرضى",c:["علاج / دواء","مساعدة","أخرى"]},general:{n:"العام",c:["مصروفات عامة","مساعدة","أخرى"]}};
const $=i=>document.getElementById(i);let cur="schools",pws={},rows=[],type="in",shown=[];
const fmt=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>{const d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML};
const nm=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).toLowerCase().replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").trim();
function api(op,d){const f=cur;return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).api(JSON.stringify(Object.assign({op,fund:f,pw:pws[f]},d||{}))))}
async function load(){const j=await api("list");if(!j.ok)throw new Error(j.err||"x");rows=j.rows;render()}
function tabs(){$("tabs").innerHTML=Object.keys(FUNDS).map(k=>`<button data-k="${k}" class="${cur===k?"on":""}">${pws[k]?"":"🔒 "}${FUNDS[k].n}</button>`).join("");
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;rows=[];show()})}
function ui(open){$("lock").hidden=open;$("app").hidden=!open;if(open){$("cat").innerHTML=FUNDS[cur].c.map(c=>`<option>${esc(c)}</option>`).join("");setType("in")}else{$("lt").textContent="صندوق "+FUNDS[cur].n;$("pw").value="";$("le").textContent=""}tabs()}
async function show(){if(pws[cur]){ui(true);try{await load()}catch(e){delete pws[cur];ui(false)}}else ui(false)}
$("go").onclick=async()=>{const k=cur;pws[k]=$("pw").value;$("le").textContent="";try{await load();ui(true)}catch(e){delete pws[k];$("le").textContent=e.message==="auth"?"كلمة السر غير صحيحة":"تعذّر الاتصال، حاولي مرة أخرى"}};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};$("lk").onclick=()=>{delete pws[cur];rows=[];show()};
function setType(t){type=t;$("tIn").className="btn"+(t==="in"?"":" alt");$("tOut").className="btn"+(t==="out"?"":" alt");document.querySelectorAll(".xo").forEach(e=>e.hidden=t==="in")}
$("tIn").onclick=()=>setType("in");$("tOut").onclick=()=>setType("out");$("q").oninput=render;$("ft").onchange=render;$("date").value=new Date().toISOString().slice(0,10);
const sums=l=>{let i=0,o=0;l.forEach(t=>t.type==="in"?i+=+t.amount:o+=+t.amount);return{i,o,b:i-o}};
function render(){const s=sums(rows);
$("cards").innerHTML=`<div class="card"><small>إجمالي الوارد</small><b class="in">${fmt(s.i)}</b></div><div class="card"><small>إجمالي المصروف</small><b class="out">${fmt(s.o)}</b></div><div class="card"><small>الرصيد</small><b>${fmt(s.b)}</b></div>`;
const ms=[],n=new Date();for(let k=5;k>=0;k--)ms.push(new Date(n.getFullYear(),n.getMonth()-k,1).toISOString().slice(0,7));
const d=ms.map(m=>sums(rows.filter(t=>String(t.date).slice(0,7)===m))),mx=Math.max(1,...d.flatMap(x=>[x.i,x.o]));
$("chart").innerHTML=d.map((x,k)=>`<div class="col"><div class="bars"><i style="height:${x.i/mx*100}%;background:var(--in)"></i><i style="height:${x.o/mx*100}%;background:var(--out)"></i></div>${ms[k].slice(5)}/${ms[k].slice(2,4)}</div>`).join("");
const q=nm($("q").value),qd=q.replace(/\D/g,""),ty=$("ft").value;
shown=rows.filter(t=>(!ty||t.type===ty)&&(!q||[t.who,t.rcpt,t.note].some(v=>nm(v).includes(q))||(qd&&nm(t.phone).replace(/\D/g,"").includes(qd)))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
const f=sums(shown);$("sum").textContent=`النتائج: ${shown.length} حركة — وارد ${fmt(f.i)} — مصروف ${fmt(f.o)}`;
$("rows").innerHTML=shown.map(t=>`<tr><td>${esc(t.date)}</td><td class="${t.type}">${t.type==="in"?"وارد":"مصروف"}</td><td>${esc(t.cat)}</td><td>${esc(t.who)}</td><td>${esc(t.phone)}</td><td>${fmt(t.amount)}</td><td>${esc(t.rcpt)}</td><td>${esc(t.note)}</td><td><button class="x" data-id="${esc(t.id)}">×</button></td></tr>`).join("")||`<tr><td colspan="9" style="color:var(--mut)">لا توجد حركات</td></tr>`;
$("rows").querySelectorAll(".x").forEach(b=>b.onclick=async()=>{if(confirm("حذف هذه الحركة؟")){await api("del",{id:b.dataset.id});load()}})}
$("f").onsubmit=async e=>{e.preventDefault();const a=parseFloat($("amt").value);if(!(a>0))return;$("sv").disabled=true;$("fe").textContent="";
const o=type==="out";try{const j=await api("add",{row:{date:$("date").value,type,cat:o?$("cat").value:"عشور",amount:a,who:o?$("who").value.trim():"",phone:o?$("ph").value.trim():"",rcpt:o?$("rc").value.trim():"",note:$("nt").value.trim()}});
if(!j.ok)throw 0;["amt","who","ph","rc","nt"].forEach(i=>$(i).value="");await load()}catch(x){$("fe").textContent="تعذّر الحفظ، حاولي مرة أخرى."}$("sv").disabled=false};
$("exp").onclick=()=>{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const r=[["التاريخ","النوع","البند","الاسم","الموبايل","المبلغ","إيصال","ملاحظات"]].concat(shown.map(t=>[t.date,t.type==="in"?"وارد":"مصروف",t.cat,t.who,t.phone,t.amount,t.rcpt,t.note]));
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r.map(x=>x.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download=cur+".csv";a.click()};
ui(false);
</script></body></html>
